[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:fluxbox]
command=/usr/bin/fluxbox -display :99
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox_err.log
priority=5

[program:blender]
; --threads borne l'ordonnanceur interne de Blender. Sans lui il se
; dimensionne sur les CPU de la MACHINE vus dans /proc — 104 ici pour un
; quota de 4 — et lance des centaines de fils. render.threads ne suffit
; pas : il ne pilote que le rendu, pas le pool de taches.
command=/opt/blender/blender --threads %(ENV_BLENDER_THREADS)s --python /app/blender_addon.py
environment=DISPLAY=":99"
directory=/projects
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/blender.log
stderr_logfile=/var/log/supervisor/blender_err.log
priority=10

[program:fit_blender]
command=/app/fit-blender.sh
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/var/log/supervisor/fit_blender.log
stderr_logfile=/var/log/supervisor/fit_blender_err.log
priority=12

[program:x11vnc]
; -defer et -wait a 10 ms au lieu de 30 : x11vnc attend moins avant de
; pousser une image, au prix de quelques images de plus. Sur un bureau
; interactif, la latence compte davantage que la bande passante.
; -threads : une connexion lente n'en bloque plus une autre.
command=/usr/bin/env -u WAYLAND_DISPLAY -u XDG_RUNTIME_DIR /usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -defer 10 -wait 10 -threads
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc_err.log
priority=15

[program:api_server]
command=python3 /app/api_server.py
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api_err.log
priority=20

[program:novnc]
command=/usr/bin/websockify --web=/opt/novnc 6080 localhost:5900
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc_err.log
priority=25

[program:stream_server]
command=python3 /app/stream_server.py
environment=DISPLAY=":99"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/stream.log
stderr_logfile=/var/log/supervisor/stream_err.log
priority=30
