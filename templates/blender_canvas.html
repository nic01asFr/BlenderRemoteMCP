<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bureau Blender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --br-accent: #ff6b35;
            --br-stage: #e8ebf0;
            --br-ink: #1a1d24;
            --br-muted: #69707d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
            background: var(--br-stage);
        }

        /* Stage = profondeur autour du bureau (pattern QGIS desk). */
        .stage {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 12px;
            background-color: var(--br-stage);
            background-image:
                linear-gradient(135deg, rgba(255,255,255,.65) 1px, transparent 1px),
                linear-gradient(45deg, rgba(20,30,50,.06) 1px, transparent 1px),
                linear-gradient(135deg, transparent 48%, rgba(255,107,53,.04) 49%, rgba(255,107,53,.04) 51%, transparent 52%),
                linear-gradient(45deg, transparent 48%, rgba(0,0,0,.025) 49%, rgba(0,0,0,.025) 51%, transparent 52%);
            background-size: 28px 28px, 28px 28px, 56px 56px, 56px 56px;
            background-position: 0 0, 0 0, 0 0, 14px 14px;
        }
        .stage.embed {
            padding: 0;
            background: #0d0d0d;
            background-image: none;
        }

        .frame {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background: #0d0d0d;
            box-shadow:
                0 0 0 1px rgba(15, 23, 42, .1),
                0 10px 28px rgba(15, 23, 42, .14),
                0 2px 6px rgba(15, 23, 42, .08);
        }
        .stage.embed .frame {
            border-radius: 0;
            box-shadow: none;
        }

        #desktop {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0d;
        }
        #desktop > canvas,
        #desktop > div {
            max-width: 100%;
            max-height: 100%;
        }

        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0d;
            z-index: 10;
            color: #c8c8c8;
            text-align: center;
            padding: 24px;
            border-radius: inherit;
        }
        #overlay[hidden] { display: none; }
        #overlay .msg {
            font-size: 15px;
            letter-spacing: 0.02em;
            color: #9a9a9a;
        }
        #overlay .err {
            color: #e8e8e8;
            font-size: 16px;
            margin-bottom: 16px;
        }
        #overlay button {
            padding: 10px 20px;
            background: var(--br-accent);
            color: #111;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
        }
        #overlay button:hover { filter: brightness(1.05); }
        #overlay button[hidden] { display: none; }
    </style>
</head>
<body>
    <div class="stage{% if embed %} embed{% endif %}">
        <div class="frame">
            <div id="overlay" role="status">
                <div>
                    <p class="msg" id="overlay-msg">Démarrage…</p>
                    <p class="err" id="overlay-err" hidden></p>
                    <button type="button" id="overlay-retry" hidden>Réessayer</button>
                </div>
            </div>
            <div id="desktop"></div>
        </div>
    </div>

    <script type="module">
        import RFB from '/static/novnc/core/rfb.js';

        const userId = '{{ user_id }}';
        const wsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://')
            + window.location.host + '/ws/' + userId;

        const desktop = document.getElementById('desktop');
        const overlay = document.getElementById('overlay');
        const overlayMsg = document.getElementById('overlay-msg');
        const overlayErr = document.getElementById('overlay-err');
        const overlayRetry = document.getElementById('overlay-retry');

        let rfb = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        function showBoot(text) {
            overlay.hidden = false;
            overlayMsg.hidden = false;
            overlayMsg.textContent = text;
            overlayErr.hidden = true;
            overlayRetry.hidden = true;
        }

        function showError(message) {
            overlay.hidden = false;
            overlayMsg.hidden = true;
            overlayErr.hidden = false;
            overlayErr.textContent = message;
            overlayRetry.hidden = false;
        }

        function hideOverlay() {
            overlay.hidden = true;
        }

        async function connect() {
            try {
                showBoot(reconnectAttempts
                    ? `Reconnexion… (${reconnectAttempts}/${maxReconnectAttempts})`
                    : 'Démarrage…');

                if (rfb) {
                    try { rfb.disconnect(); } catch (_) { /* ignore */ }
                    rfb = null;
                }

                rfb = new RFB(desktop, wsUrl, {
                    scaleViewport: true,
                    resizeSession: true,
                    focusOnClick: true,
                    clipViewport: false,
                    showDotCursor: false,
                    qualityLevel: 6,
                    compressionLevel: 2,
                });

                rfb.addEventListener('connect', () => {
                    hideOverlay();
                    reconnectAttempts = 0;
                    rfb.focus();
                });

                rfb.addEventListener('disconnect', (e) => {
                    if (e.detail && e.detail.clean) {
                        showError('Session terminée.');
                        return;
                    }
                    if (reconnectAttempts < maxReconnectAttempts) {
                        reconnectAttempts += 1;
                        showBoot(`Reconnexion… (${reconnectAttempts}/${maxReconnectAttempts})`);
                        setTimeout(connect, 2000);
                    } else {
                        showError('Session indisponible.');
                    }
                });

                rfb.addEventListener('credentialsrequired', () => {
                    rfb.sendCredentials({ password: '' });
                });
            } catch (e) {
                showError('Impossible de démarrer la session.');
            }
        }

        overlayRetry.addEventListener('click', () => {
            reconnectAttempts = 0;
            connect();
        });

        connect();
    </script>
</body>
</html>
