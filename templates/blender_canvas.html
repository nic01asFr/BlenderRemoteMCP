<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bureau Blender</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d0d;
        }
        #desktop {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0d;
        }
        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0d;
            z-index: 10;
            color: #c8c8c8;
            font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
            text-align: center;
            padding: 24px;
        }
        #overlay[hidden] { display: none; }
        #overlay .msg {
            font-size: 15px;
            letter-spacing: 0.02em;
            color: #9a9a9a;
        }
        #overlay .err {
            color: #e8e8e8;
            font-size: 16px;
            margin-bottom: 16px;
        }
        #overlay button {
            padding: 10px 20px;
            background: #ff6b35;
            color: #111;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
        }
        #overlay button:hover { filter: brightness(1.05); }
        #overlay button[hidden] { display: none; }
    </style>
</head>
<body>
    <div id="overlay" role="status">
        <div>
            <p class="msg" id="overlay-msg">Démarrage…</p>
            <p class="err" id="overlay-err" hidden></p>
            <button type="button" id="overlay-retry" hidden>Réessayer</button>
        </div>
    </div>
    <div id="desktop"></div>

    <script type="module">
        import RFB from '/static/novnc/core/rfb.js';

        const userId = '{{ user_id }}';
        const wsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://')
            + window.location.host + '/ws/' + userId;

        const desktop = document.getElementById('desktop');
        const overlay = document.getElementById('overlay');
        const overlayMsg = document.getElementById('overlay-msg');
        const overlayErr = document.getElementById('overlay-err');
        const overlayRetry = document.getElementById('overlay-retry');

        let rfb = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        function showBoot(text) {
            overlay.hidden = false;
            overlayMsg.hidden = false;
            overlayMsg.textContent = text;
            overlayErr.hidden = true;
            overlayRetry.hidden = true;
        }

        function showError(message) {
            overlay.hidden = false;
            overlayMsg.hidden = true;
            overlayErr.hidden = false;
            overlayErr.textContent = message;
            overlayRetry.hidden = false;
        }

        function hideOverlay() {
            overlay.hidden = true;
        }

        async function connect() {
            try {
                showBoot(reconnectAttempts
                    ? `Reconnexion… (${reconnectAttempts}/${maxReconnectAttempts})`
                    : 'Démarrage…');

                if (rfb) {
                    try { rfb.disconnect(); } catch (_) { /* ignore */ }
                    rfb = null;
                }

                rfb = new RFB(desktop, wsUrl, {
                    scaleViewport: true,
                    resizeSession: true,
                    focusOnClick: true,
                    clipViewport: false,
                    showDotCursor: false,
                    qualityLevel: 6,
                    compressionLevel: 2,
                });

                rfb.addEventListener('connect', () => {
                    hideOverlay();
                    reconnectAttempts = 0;
                    rfb.focus();
                });

                rfb.addEventListener('disconnect', (e) => {
                    if (e.detail && e.detail.clean) {
                        showError('Session terminée.');
                        return;
                    }
                    if (reconnectAttempts < maxReconnectAttempts) {
                        reconnectAttempts += 1;
                        showBoot(`Reconnexion… (${reconnectAttempts}/${maxReconnectAttempts})`);
                        setTimeout(connect, 2000);
                    } else {
                        showError('Session indisponible.');
                    }
                });

                rfb.addEventListener('credentialsrequired', () => {
                    rfb.sendCredentials({ password: '' });
                });
            } catch (e) {
                showError('Impossible de démarrer la session.');
            }
        }

        overlayRetry.addEventListener('click', () => {
            reconnectAttempts = 0;
            connect();
        });

        connect();
    </script>
</body>
</html>
