apiVersion: v1
kind: Service
metadata:
  name: blender-remote-mcp
  labels:
    {{- include "blender-remote-mcp.labels" . | nindent 4 }}
spec:
  selector:
    app: blender-remote-mcp
  ports:
    - name: mcp
      port: {{ .Values.service.port }}
      targetPort: mcp
    - name: novnc
      port: {{ .Values.service.novncPort }}
      targetPort: novnc
